paths:

  /communities:
    post:
      tags: [Communities]
      summary: Create a community
      description: |
        Conditions:
        - Minimum of 10 members
        - Seniority/Tenure >= 6 months
        - Mandatory positions filled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Community'
      responses:
        201:
          description: Community created
        400:
          description: Conditions not met

    get:
      tags: [Communities]
      summary: List all communities
      responses:
        200:
          description: OK

  /members:
    post:
      tags: [Members]
      summary: Add a member
      description: |
        - Mandatory sponsorship/referral
        - Payment required
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Member'
      responses:
        201:
          description: Member created

    get:
      tags: [Members]
      summary: List all members
      responses:
        200:
          description: OK

  /members/{id}/transfer-community:
    put:
      tags: [Members]
      summary: Transfer to another community
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Community changed successfully

  /members/{id}/resignation:
    put:
      tags: [Members]
      summary: Resignation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Resignation processed

  /mandates:
    post:
      tags: [Mandates]
      summary: Create a mandate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mandate'
      responses:
        201:
          description: Mandate created

    get:
      tags: [Mandates]
      summary: List all mandates
      responses:
        200:
          description: OK