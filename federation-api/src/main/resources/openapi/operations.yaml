paths:

  /contributions:
    post:
      tags: [Contributions]
      summary: Register a contribution
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contribution'
      responses:
        201:
          description: Contribution registered

    get:
      tags: [Contributions]
      summary: List all contributions
      responses:
        200:
          description: OK

  /accounts:
    post:
      tags: [Accounts]
      summary: Create an account
      description: |
        - Only one fund authorized
        - Holder = actual member
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account'
      responses:
        201:
          description: Account created

    get:
      tags: [Accounts]
      summary: List all accounts
      responses:
        200:
          description: OK

  /activities:
    post:
      tags: [Activities]
      summary: Create an activity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Activity'
      responses:
        201:
          description: Activity created

    get:
      tags: [Activities]
      summary: List all activities
      responses:
        200:
          description: OK

  /attendance:
    post:
      tags: [Attendance]
      summary: Register attendance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Attendance'
      responses:
        201:
          description: Attendance registered

  /statistics/member/{id}:
    get:
      tags: [Statistics]
      summary: Member statistics
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberStatistics'

  /statistics/community/{id}:
    get:
      tags: [Statistics]
      summary: Community statistics
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: OK