components:
  schemas:

    Collective:
      type: object
      required: [name, number, city, specialty]
      properties:
        id:
          type: integer
        name:
          type: string
        number:
          type: string
        city:
          type: string
        specialty:
          type: string
        createdAt:
          type: string
          format: date

    Member:
      type: object
      required: [lastName, firstName, email, profession, field]
      properties:
        id:
          type: integer
        lastName:
          type: string
        firstName:
          type: string
        email:
          type: string
        profession:
          type: string
          description: Actual profession (producer, collector...)
        field:
          type: string
          description: Agricultural field (rice farming, livestock...)
        phone:
          type: string
        membershipDate:
          type: string
          format: date

    Role:
      type: string
      enum:
        - PRESIDENT
        - VICE_PRESIDENT
        - TREASURER
        - SECRETARY
        - CONFIRMED_MEMBER
        - JUNIOR_MEMBER

    Mandate:
      type: object
      properties:
        id:
          type: integer
        role:
          $ref: '#/components/schemas/Role'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    Account:
      type: object
      required: [type, holderName]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [CASH_BOX, BANK, MOBILE_MONEY]
        holderName:
          type: string
          description: Real person (member)
        bank:
          type: string
        accountNumber:
          type: string
        operator:
          type: string
        phoneNumber:
          type: string
        balance:
          type: number

    Contribution:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: number
        date:
          type: string
          format: date
        paymentMethod:
          type: string
          enum: [CASH, TRANSFER, MOBILE_MONEY]

    Activity:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [ASSEMBLY, TRAINING, EXCEPTIONAL]
        isMandatory:
          type: boolean
        date:
          type: string
          format: date

    Attendance:
      type: object
      properties:
        memberId:
          type: integer
        activityId:
          type: integer
        status:
          type: string
          enum: [PRESENT, ABSENT, EXCUSED]

    MemberStatistics:
      type: object
      properties:
        attendanceRate:
          type: number
        totalAmount:
          type: number
        unpaidAmount:
          type: number